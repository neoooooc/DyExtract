<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RePlay 离线保存</title><style>body{font:17px system-ui;max-width:600px;margin:12vh auto;padding:24px;background:#f5f5f2;color:#202520}textarea{box-sizing:border-box;width:100%;height:140px;padding:16px;font:inherit;border:1px solid #ccc;border-radius:12px}button,a{display:inline-block;padding:14px 20px;border:0;border-radius:10px;background:#185b48;color:white;font:inherit;margin-top:16px}p{line-height:1.7}#status{white-space:pre-wrap}</style><h1>RePlay</h1><p>保存值得重看的视频，留给没有网络的时刻。</p><textarea id="url" placeholder="粘贴抖音公开视频分享链接"></textarea><button id="go">解析视频</button><p id="status" role="status"></p><a id="save" hidden style="display:none">保存视频</a><p>仅处理你有权保存、且平台明确允许下载的公开视频。保留原下载文件；权限不明或平台限制时停止。</p><script>const go=document.getElementById('go'),status=document.getElementById('status'),save=document.getElementById('save');go.onclick=async()=>{go.disabled=true;save.style.display='none';status.textContent='正在检查视频…';try{const r=await fetch('/api/entry?action=parse&url='+encodeURIComponent(document.getElementById('url').value));const d=await r.json();if(!r.ok)throw Error(d.error||'解析失败');status.textContent=d.title+'\n作者：'+d.author;save.href=d.download_url;save.style.display='inline-block';save.hidden=false;}catch(e){status.textContent=e.message;}finally{go.disabled=false;}};</script></html>
